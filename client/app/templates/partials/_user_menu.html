{# Header user button + Metro dropdown menu, shared by every logged-in page. #}
<div class="dropdown-button ml-auto">
  <button type="button" class="button dropdown-toggle">
    <span class="badge inline bg-crimson fg-white mr-2">{{ current_user.name | initials }}</span>
    {{ current_user.name }}
  </button>
  <ul class="d-menu place-right" data-role="dropdown">
    <li class="p-2 pl-4 pr-4">
      <div class="text-bold">{{ current_user.name }}</div>
      <div class="text-small fg-gray">{{ current_user.email }}</div>
    </li>
    <li class="divider"></li>
    <li><a href="{{ url_for('auth.profile') }}"><span class="mif-person icon"></span> My Profile</a></li>
    <li><a href="{{ url_for('banking.info', page='security') }}"><span class="mif-security icon"></span> Security</a></li>
    <li class="divider"></li>
    <li>
      <a href="#" class="fg-crimson" onclick="Metro.dialog.open('#modal-logout'); return false;">
        <span class="mif-exit icon"></span> Sign Out
      </a>
    </li>
  </ul>
</div>
