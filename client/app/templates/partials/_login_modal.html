{# Sign-in modal. Opens on load when the view passes open_modal == 'login'
   (see auth.login's GET handler). #}
<div class="ui-modal-overlay {{ 'active' if open_modal == 'login' }}" id="modal-login">
  <div class="ui-modal" role="dialog" aria-modal="true" aria-labelledby="login-modal-title">
    <div class="ui-modal-header">
      <h3 id="login-modal-title"><i class="fa-solid fa-right-to-bracket text-accent"></i> Secure Client Login</h3>
      <button type="button" class="ui-modal-close" data-close-modal><i class="fa-solid fa-xmark"></i></button>
    </div>
    <form method="post" action="{{ url_for('auth.login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="ui-modal-body">
        <div class="ui-form-group">
          <label for="login-email">Email</label>
          <div class="ui-input-wrapper">
            <i class="fa-solid fa-user"></i>
            <input type="email" id="login-email" name="email" autocomplete="email" placeholder="you@example.com"
              required>
          </div>
        </div>
        <div class="ui-form-group">
          <label for="login-password">Password</label>
          <div class="ui-input-wrapper">
            <i class="fa-solid fa-key"></i>
            <input type="password" id="login-password" name="password" autocomplete="current-password"
              placeholder="Your password" required>
          </div>
        </div>
      </div>
      <div class="ui-modal-footer">
        <button type="button" class="ui-btn ui-btn-secondary" data-close-modal>Cancel</button>
        <button type="submit" class="ui-btn ui-btn-red">Log In</button>
      </div>
    </form>
  </div>
</div>
