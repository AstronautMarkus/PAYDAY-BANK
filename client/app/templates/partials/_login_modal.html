{# Sign-in modal (Metro dialog). Opens on load when the view passes
   open_modal == 'login' (see auth.login's GET handler). #}
<div class="dialog" data-role="dialog" id="modal-login" data-show="{{ 'true' if open_modal == 'login' else 'false' }}"
  data-close-button="true" data-overlay-click-close="true" data-width="420"
  role="dialog" aria-modal="true" aria-labelledby="login-modal-title">
  <div class="dialog-title" id="login-modal-title"><span class="mif-enter fg-crimson"></span> Secure Client Login</div>
  <div class="dialog-content">
    <form method="post" action="{{ url_for('auth.login') }}" id="login-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" name="email" autocomplete="email" placeholder="you@example.com"
          data-role="input" data-prepend="<span class='mif-person'></span>" required>
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" name="password" autocomplete="current-password"
          placeholder="Your password" data-role="input" data-prepend="<span class='mif-key'></span>" required>
      </div>
    </form>
  </div>
  <div class="dialog-actions">
    <button type="button" class="button js-dialog-close">Cancel</button>
    <button type="submit" form="login-form" class="button button-crimson">Log In</button>
  </div>
</div>
