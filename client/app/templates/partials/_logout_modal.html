{# Sign-out confirmation (Metro dialog), shared by every logged-in page. #}
<form id="logout-form" action="{{ url_for('auth.logout') }}" method="post" hidden>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
</form>

<div class="dialog" data-role="dialog" id="modal-logout" data-close-button="true" data-overlay-click-close="true"
  data-width="420" role="dialog" aria-modal="true" aria-labelledby="logout-modal-title">
  <div class="dialog-title" id="logout-modal-title"><span class="mif-exit fg-crimson"></span> Sign Out</div>
  <div class="dialog-content">
    Are you sure you want to sign out of your online banking session?
  </div>
  <div class="dialog-actions">
    <button type="button" class="button js-dialog-close">Cancel</button>
    <button type="submit" form="logout-form" class="button button-crimson">Sign Out</button>
  </div>
</div>
