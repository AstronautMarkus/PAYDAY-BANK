<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Banco Legado{% endblock %}</title>
  <style>
    :root {
      --ink: #172b3a;
      --muted: #667887;
      --paper: #f6f7f3;
      --panel: #ffffff;
      --line: #d7e0e3;
      --teal: #087f8c;
      --teal-dark: #075763;
      --gold: #c99532;
      --error: #a33a36;
      --success: #28734d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: linear-gradient(135deg, #e9f0ed 0%, #f8f5ec 52%, #dce8e9 100%);
      font-family: "Trebuchet MS", "Lucida Grande", sans-serif;
    }

    a {
      color: var(--teal-dark);
    }

    .shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 72px;
      padding: 0 5vw;
      background: rgba(255, 255, 255, .9);
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      gap: 12px;
      align-items: center;
      color: var(--ink);
      text-decoration: none;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      color: white;
      background: var(--teal);
      border-radius: 50%;
      font-family: Georgia, serif;
      font-size: 20px;
    }

    .brand-name {
      font-family: Georgia, serif;
      font-size: 19px;
      letter-spacing: .2px;
    }

    .nav {
      display: flex;
      gap: 18px;
      align-items: center;
      font-size: 13px;
    }

    .nav a {
      text-decoration: none;
    }

    .nav form {
      margin: 0;
    }

    .link-button {
      border: 0;
      background: transparent;
      color: var(--teal-dark);
      cursor: pointer;
      font: inherit;
      padding: 0;
    }

    main {
      width: min(1080px, 90vw);
      margin: 0 auto;
      flex: 1;
      padding: 48px 0 64px;
    }

    .auth-layout {
      display: grid;
      grid-template-columns: .9fr 1.1fr;
      gap: 56px;
      align-items: center;
      min-height: 620px;
    }

    .eyebrow {
      color: var(--gold);
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1,
    h2 {
      font-family: Georgia, serif;
      font-weight: normal;
      margin: 0;
    }

    h1 {
      font-size: clamp(36px, 5vw, 64px);
      line-height: 1.03;
      max-width: 560px;
    }

    h2 {
      font-size: 28px;
    }

    .lead {
      color: var(--muted);
      line-height: 1.7;
      max-width: 480px;
    }

    .card {
      background: rgba(255, 255, 255, .92);
      border: 1px solid var(--line);
      border-radius: 6px;
      box-shadow: 0 18px 50px rgba(24, 55, 64, .10);
      padding: 30px;
    }

    .auth-card {
      max-width: 480px;
      width: 100%;
      justify-self: end;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 24px;
    }

    .form-grid .wide {
      grid-column: 1 / -1;
    }

    label {
      display: grid;
      gap: 7px;
      color: var(--ink);
      font-size: 12px;
      font-weight: bold;
    }

    input {
      width: 100%;
      border: 1px solid #b9c9cd;
      border-radius: 3px;
      background: #fbfcfa;
      color: var(--ink);
      font: inherit;
      padding: 12px 13px;
      outline: none;
    }

    input:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(8, 127, 140, .13);
    }

    .hint {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
      font-weight: normal;
    }

    .button {
      border: 0;
      border-radius: 3px;
      padding: 13px 18px;
      background: var(--teal);
      color: #fff;
      cursor: pointer;
      font: bold 13px "Trebuchet MS", sans-serif;
    }

    .button:hover {
      background: var(--teal-dark);
    }

    .button.wide {
      width: 100%;
      margin-top: 22px;
    }

    .form-footer {
      color: var(--muted);
      font-size: 12px;
      margin: 22px 0 0;
      text-align: center;
    }

    .flash {
      border-left: 4px solid;
      margin: 0 auto 20px;
      padding: 12px 15px;
      background: rgba(255, 255, 255, .85);
      font-size: 13px;
    }

    .flash.ok {
      border-color: var(--success);
      color: var(--success);
    }

    .flash.error {
      border-color: var(--error);
      color: var(--error);
    }

    .dashboard-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 30px;
    }

    .account-number {
      color: var(--teal-dark);
      font-family: Georgia, serif;
      font-size: 21px;
      letter-spacing: 2px;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 1.3fr .7fr;
      gap: 20px;
    }

    .balance-card {
      background: var(--teal-dark);
      color: white;
      border-radius: 6px;
      padding: 28px;
      min-height: 190px;
    }

    .balance-card .label {
      color: #bde3e2;
      font-size: 12px;
    }

    .balance {
      font-family: Georgia, serif;
      font-size: 42px;
      margin-top: 28px;
    }

    .profile-card h2 {
      font-size: 22px;
      margin-bottom: 18px;
    }

    .profile-row {
      border-top: 1px solid var(--line);
      padding: 11px 0;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 12px;
    }

    .profile-row span:first-child {
      color: var(--muted);
    }

    .actions {
      margin-top: 20px;
    }

    .actions h2 {
      margin-bottom: 18px;
    }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .action-card h3 {
      font-family: Georgia, serif;
      font-size: 20px;
      font-weight: normal;
      margin: 0 0 14px;
    }

    .action-card input {
      margin-bottom: 10px;
    }

    @media (max-width: 760px) {
      .topbar {
        padding: 0 5vw;
      }

      .nav a:first-child {
        display: none;
      }

      main {
        padding-top: 30px;
      }

      .auth-layout,
      .dashboard-grid,
      .action-grid {
        grid-template-columns: 1fr;
      }

      .auth-card {
        justify-self: stretch;
      }

      .dashboard-head {
        align-items: start;
        flex-direction: column;
      }
    }

    @media (max-width: 480px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-grid .wide {
        grid-column: auto;
      }

      .card {
        padding: 22px;
      }
    }
  </style>
</head>

<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="{{ url_for('banking.dashboard') if current_user else url_for('auth.login') }}">
        <span class="brand-mark">B</span><span class="brand-name">Banco Legado</span>
      </a>
      {% if current_user %}
      <nav class="nav">
        <a href="{{ url_for('banking.dashboard') }}">Mi dashboard</a>
        <form action="{{ url_for('auth.logout') }}" method="post"><button class="link-button" type="submit">Cerrar
            sesión</button></form>
      </nav>
      {% endif %}
    </header>
    <main>
      {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
  </div>
</body>

</html>
