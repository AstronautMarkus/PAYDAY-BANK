<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PAYDAY BANK{% endblock %}</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components/buttons.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components/cards.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components/forms.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components/modals.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components/table.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components/toast.css') }}">
  {% block extra_head %}{% endblock %}
</head>

<body class="{% block body_class %}{% endblock %}">
  {% block content %}{% endblock %}
  {% include "partials/_toast_stack.html" %}
  <script src="{{ url_for('static', filename='js/toast.js') }}" defer></script>
  {% block extra_scripts %}{% endblock %}
</body>

</html>
